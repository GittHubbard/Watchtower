name: Refresh macro events

on:
  schedule:
    # 13:00 UTC every Monday = 8 AM EST (standard time).
    # During DST (mid-Mar to early Nov), this fires at 9 AM EDT.
    # GitHub cron is UTC-only and does not adjust for DST.
    - cron: "0 13 * * 1"
  workflow_dispatch: {}   # allow manual triggering for testing

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to commit macro_events.csv back
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: "3.11"

      # Cache the whole virtualenv so unchanged runs skip installation entirely.
      # The key busts automatically when the OS, the exact Python version, or
      # requirements.txt change. The full patch version matters: a venv
      # hard-codes the absolute path of the interpreter it was built from, and
      # runner image updates move that path (3.11.15 -> 3.11.16), so a venv
      # keyed on "3.11" alone survives into a run where its interpreter is gone.
      # Bump the trailing -v2 to force a clean rebuild for anything the hash
      # can't see — e.g. a package pulled from a custom index outside
      # requirements.txt, or a stale/broken cached venv.
      - name: Cache venv
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}-v2

      # Runs unconditionally and rebuilds only when the venv can't actually
      # import what the scraper needs, so a cache hit that turns out to be
      # unusable self-heals instead of failing the run.
      - name: Install scrape dependencies
        run: |
          if ! .venv/bin/python -c "import cloudscraper, pandas, bs4" >/dev/null 2>&1; then
            echo "No usable venv found — building one."
            rm -rf .venv
            python -m venv .venv
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/pip install -r requirements.txt
          else
            echo "Reusing cached venv."
          fi

      # Call the venv interpreter by path rather than sourcing `activate`:
      # activate only edits PATH, so a broken .venv/bin/python silently falls
      # through to the system interpreter and fails with a confusing
      # ModuleNotFoundError instead of an obvious missing-venv error.
      - name: Run macro events scraper
        run: .venv/bin/python scripts/macroevents_webscrape.py

      - name: Commit updated macro_events.csv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/macro_events.csv
          if ! git diff --staged --quiet; then
            git commit -m "Refresh macro_events.csv $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes to macro_events.csv."
          fi
