name: EOD pipeline

on:
  schedule:
    # 21:30 UTC Mon-Fri — covers 4:30pm ET (DST) and 5:30pm ET (standard time).
    # GitHub cron runs in UTC and ignores DST, so we accept the half-hour drift.
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}  # allow manual triggering

jobs:
  eod:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to commit data/ outputs back
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Cache the whole virtualenv so unchanged runs skip installation entirely.
      # The key busts automatically when the OS, Python version, or dependency
      # files (requirements.txt / pyproject.toml, since we `pip install -e .`)
      # change. Bump the trailing -v1 to force a clean rebuild for anything the
      # hash can't see — e.g. a package pulled from a custom index outside these
      # files, or a stale/broken cached venv.
      - name: Cache venv
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.11-${{ hashFiles('requirements.txt', 'pyproject.toml') }}-v1

      - name: Install
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run EOD pipeline
        run: |
          . .venv/bin/activate
          python -m gamma_workflow.run_eod

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "EOD run $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes to commit."
          fi
